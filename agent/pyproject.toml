[project]
name = "space-agent"
version = "0.1.0"
description = "Nagi Space の自宅側のプロセス（botたんと字幕）。design.md D5"
requires-python = ">=3.12"
dependencies = [
  "livekit==1.2.2",
  "aiohttp>=3.9,<4",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["space_agent"]
