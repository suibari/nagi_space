# ローカル開発用の LiveKit サーバーと保存先（PostgreSQL + PostgREST）。
# 本番は LiveKit Cloud（または自前の LiveKit）と自宅の PostgREST を環境変数で指定する（design.md D1・D10）。
services:
  livekit:
    image: livekit/livekit-server:v1.13.0
    # ホストの 127.0.0.1 で待ち受けるアプリへ Webhook を送るため、ホストのネットワークで動かす（Linux 向け）
    command: --config /etc/livekit.yaml --bind 127.0.0.1
    network_mode: host
    volumes:
      - ./ops/dev/livekit.yaml:/etc/livekit.yaml:ro
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nagi
      POSTGRES_PASSWORD: nagi
      POSTGRES_DB: nagi
    volumes:
      - ./ops/dev/postgres:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    ports:
      - '127.0.0.1:54329:5432'
  postgrest:
    image: postgrest/postgrest:v12.2.8
    depends_on: [postgres]
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@postgres:5432/nagi
      PGRST_DB_SCHEMAS: nagi_space
      PGRST_DB_ANON_ROLE: web_anon
      # ローカル専用の秘密。アプリは role=nagi_space_api の JWT で呼ぶ（.env.example の POSTGREST_JWT）
      PGRST_JWT_SECRET: local-dev-postgrest-jwt-secret-0123456789abcdef
    ports:
      - '127.0.0.1:3399:3000'
