# ローカル開発用の LiveKit サーバーと Redis。
# 本番は LiveKit Cloud（または自前の LiveKit）と Upstash Redis を環境変数で指定する（design.md D10）。
services:
  livekit:
    image: livekit/livekit-server:v1.9.0
    # API キー devkey / シークレット secret。Webhook はホスト側のアプリへ送る（ops/dev/livekit.yaml）
    # ホストの 127.0.0.1 で待ち受けるアプリへ Webhook を送るため、ホストのネットワークで動かす（Linux 向け）
    command: --config /etc/livekit.yaml --bind 127.0.0.1
    network_mode: host
    volumes:
      - ./ops/dev/livekit.yaml:/etc/livekit.yaml:ro
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:6379:6379'
